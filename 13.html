<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路燈維修系統 (精裝預覽版)</title>
    <style>
        :root { --primary-color: #3498db; --success-color: #27ae60; --bg-color: #f0f2f5; }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #fff; padding: 30px; width: 100%; max-width: 480px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        h3 { text-align: center; color: #2c3e50; margin-top: 0; font-size: 24px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        label { font-size: 14px; font-weight: bold; color: #555; display: block; margin-top: 18px; }
        select, input, textarea, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; transition: all 0.3s; }
        select:focus, input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 3px rgba(52,152,219,0.1); }
        
        /* 照片組美化 */
        .photo-group { background: #fff; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid #e1e8ed; position: relative; }
        .photo-group:nth-child(even) { background: #f8f9fa; }
        
        /* 預覽圖樣式 */
        .preview-container { display: flex; gap: 10px; margin-top: 10px; }
        .preview-box { flex: 1; text-align: center; }
        .preview-img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; border: 1px solid #eee; background: #eee; display: none; }
        .preview-label { font-size: 11px; color: #888; margin-top: 4px; display: block; }

        textarea { resize: vertical; min-height: 80px; display: none; }
        .btn-add { background: #fff; color: var(--primary-color); border: 2px dashed var(--primary-color); cursor: pointer; margin-top: 15px; font-weight: bold; }
        .btn-add:hover { background: #f0f7ff; }
        .btn-submit { background: var(--success-color); color: #fff; border: none; cursor: pointer; font-weight: bold; margin-top: 25px; font-size: 18px; box-shadow: 0 4px 10px rgba(39,174,96,0.3); }
        .btn-submit:hover { background: #219150; transform: translateY(-1px); }
        .btn-submit:active { transform: translateY(0); }
        button:disabled { background: #bdc3c7; cursor: not-allowed; transform: none !important; }

        #status { font-size: 14px; color: #2c3e50; margin-top: 20px; background: #eef7ff; padding: 15px; border-radius: 8px; display: none; border-left: 5px solid var(--primary-color); line-height: 1.6; }
        hr { border: 0; border-top: 1px solid #eee; margin: 25px 0; }
    </style>
</head>
<body>

<div class="card">
    <h3>🛠 路燈維修回報</h3>
    
    <label>📍 選擇維修項目</label>
    <select id="sel"><option>載入中...</option></select>

    <label>📅 完成日期 (I 欄)</label>
    <input type="date" id="rDate">

    <div id="photoContainer">
        <div class="photo-group">
            <div style="font-size:14px; color:#34495e; margin-bottom:10px; font-weight:bold;">📸 第 1 組照片</div>
            <div class="preview-container">
                <div class="preview-box">
                    <input type="file" class="f-pre" accept="image/*" onchange="previewImage(this, 'p1-pre')">
                    <img id="p1-pre" class="preview-img">
                    <span class="preview-label">維修前 (J 欄)</span>
                </div>
                <div class="preview-box">
                    <input type="file" class="f-post" accept="image/*" onchange="previewImage(this, 'p1-post')">
                    <img id="p1-post" class="preview-img">
                    <span class="preview-label">維修後 (K 欄)</span>
                </div>
            </div>
        </div>
    </div>
    
    <button type="button" class="btn-add" onclick="addPhotoGroup()">＋ 增加一組照片</button>

    <hr>
    <label>📝 維修說明 (L 欄)</label>
    <select id="noteType" onchange="checkNoteType()">
        <option value="無">無</option>
        <option value="台電線路問題">台電線路問題</option>
        <option value="其他">其他 (請輸入)</option>
    </select>
    <textarea id="noteOther" placeholder="請輸入維修細節..."></textarea>

    <button id="btn" class="btn-submit" onclick="handleUpload()">確認上傳存檔</button>
    <div id="status"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdpaA2X-qwW4RNbMnIdHKCE3D92rlx6aztJnFIZ9CIlBWpK5ga8f2XedMLIpjLToIr/exec"; 
let projectData = [];
let groupCount = 1;

window.onload = function() {
    document.getElementById('rDate').value = new Date().toISOString().split('T')[0];
    fetch(SCRIPT_URL).then(r => r.json()).then(data => {
        projectData = data;
        const sel = document.getElementById('sel');
        sel.innerHTML = '<option value="">-- 請選擇維修項目 --</option>';
        data.forEach(d => {
            let o = document.createElement('option');
            o.value = d.row; o.textContent = d.text;
            sel.appendChild(o);
        });
    });
};

// 預覽功能 (NEW)
function previewImage(input, previewId) {
    const preview = document.getElementById(previewId);
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
        }
        reader.readAsDataURL(input.files[0]);
    }
}

function addPhotoGroup() {
    groupCount++;
    const container = document.getElementById('photoContainer');
    const div = document.createElement('div');
    div.className = 'photo-group';
    const preId = `p${groupCount}-pre`;
    const postId = `p${groupCount}-post`;
    
    div.innerHTML = `
        <div style="font-size:14px; color:#34495e; margin-bottom:10px; font-weight:bold;">📸 第 ${groupCount} 組照片</div>
        <div class="preview-container">
            <div class="preview-box">
                <input type="file" class="f-pre" accept="image/*" onchange="previewImage(this, '${preId}')">
                <img id="${preId}" class="preview-img">
                <span class="preview-label">維修前</span>
            </div>
            <div class="preview-box">
                <input type="file" class="f-post" accept="image/*" onchange="previewImage(this, '${postId}')">
                <img id="${postId}" class="preview-img">
                <span class="preview-label">維修後</span>
            </div>
        </div>
    `;
    container.appendChild(div);
}

function checkNoteType() {
    const type = document.getElementById("noteType").value;
    document.getElementById("noteOther").style.display = (type === "其他") ? "block" : "none";
}

async function handleUpload() {
    const row = document.getElementById("sel").value;
    const dateVal = document.getElementById("rDate").value;
    const noteType = document.getElementById("noteType").value;
    const noteOther = document.getElementById("noteOther").value;
    const btn = document.getElementById("btn");
    const status = document.getElementById("status");

    if (!row) return alert("請先選擇項目");
    const finalNote = (noteType === "其他") ? noteOther : noteType;
    const currentItem = projectData.find(d => d.row == row);

    btn.disabled = true;
    status.style.display = "block";
    
    status.innerHTML = "<b>[1/4] 🚀 雲端同步啟動</b><br>正在讀取回報清單與系統參數...";

    try {
        const groups = document.querySelectorAll('.photo-group');
        const photoData = [];
        let totalSizeByte = 0;

        for (let i = 0; i < groups.length; i++) {
            const groupIdx = i + 1;
            const preFile = groups[i].querySelector('.f-pre').files[0];
            const postFile = groups[i].querySelector('.f-post').files[0];

            let preBase64 = null;
            let postBase64 = null;

            if (preFile) {
                status.innerHTML = `<b>[2/4] 🚀 雲端同步中</b><br>📷 正在轉檔：第 ${groupIdx} 組 (前)<br>⏳ 狀態：影像優化處理中...`;
                preBase64 = await compress(preFile);
                totalSizeByte += preBase64.length;
            }
            if (postFile) {
                status.innerHTML = `<b>[2/4] 🚀 雲端同步中</b><br>📷 正在轉檔：第 ${groupIdx} 組 (後)<br>⏳ 狀態：影像優化處理中...`;
                postBase64 = await compress(postFile);
                totalSizeByte += postBase64.length;
            }
            photoData.push({ pre: preBase64, post: postBase64 });
        }

        const totalMB = (totalSizeByte / (1024 * 1024)).toFixed(2);
        status.innerHTML = `<b>[3/4] 🚀 雲端同步中</b><br>📊 統計完成：總傳輸容量 ${totalMB} MB<br>📦 正在封裝資料封包...`;
        
        await new Promise(resolve => setTimeout(resolve, 500));

        const payload = { 
            row, dateStr: dateVal, note: finalNote,
            photos: photoData,
            nameA: currentItem.colA, nameB: currentItem.colB
        };

        let timers = [];
        const changeStatus = (text, delay) => {
            timers.push(setTimeout(() => { status.innerHTML = text; }, delay));
        };

        const step4Header = `<b>[4/4] 🚀 雲端同步中 (${totalMB} MB)</b>`;
        status.innerHTML = `${step4Header}<br>📤 正在傳送加密影像至伺服器...`;

        changeStatus(`${step4Header}<br>☁️ 伺服器：正在儲存圖片至雲端硬碟...`, 3000);
        changeStatus(`${step4Header}<br>📝 伺服器：正在寫入試算表第 ${row} 列...`, 8000);
        changeStatus(`${step4Header}<br>⏳ 伺服器：等待最後確認訊號...`, 13000);

        const response = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
        timers.forEach(t => clearTimeout(t));

        const result = await response.json();

        if (result.status === "success") {
            status.innerHTML = `✅ <b>同步程序全部完成！</b><br>📊 最終容量：${totalMB} MB<br>🎉 頁面即將重整...`;
            setTimeout(() => {
                alert(`回報成功！已傳輸 ${totalMB} MB。`);
                location.reload();
            }, 1000);
        } else { 
            throw new Error(result.message); 
        }

    } catch (err) {
        status.innerHTML = `❌ <b>同步程序失敗</b><br>原因：${err.message}`;
        btn.disabled = false;
    }
}

function compress(file) {
    return new Promise(resolve => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = e => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement("canvas");
                let max = 2048;
                let w = img.width, h = img.height;
                if (w > h && w > max) { h *= max/w; w = max; }
                else if (h > max) { w *= max/h; h = max; }
                canvas.width = w; canvas.height = h;
                canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL("image/jpeg", 0.7));
            };
        };
    });
}
</script>
</body>
</html>
