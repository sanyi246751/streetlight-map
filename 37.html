<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>路燈維修回報系統</title>

<style>
:root{
  --ui-blue:#3b82f6;
  --ui-dark-blue:#1e3a8a;
  --ui-green:#22c55e;
  --ui-orange:#fb923c;
  --ui-text-gray:#64748b;
  --ui-border:#e2e8f0;
}
body{
  font-family:-apple-system,"Noto Sans TC",sans-serif;
  background:linear-gradient(180deg,#93c5fd 0%,#f8fafc 100%);
  background-attachment:fixed;
  margin:0;color:#1e293b;
}
.nav-bar{padding:20px 15px 10px;text-align:center;color:var(--ui-dark-blue)}
.nav-title{font-size:26px;font-weight:800}
.container{padding:0 15px 40px;max-width:540px;margin:auto}
.card{
  background:rgba(255,255,255,.95);
  border-radius:16px;
  padding:20px;
  margin-bottom:25px;
  box-shadow:0 6px 16px rgba(0,0,0,.05);
}
.label{font-size:15px;color:var(--ui-text-gray);margin-bottom:8px;font-weight:bold;display:block}
.input-field{
  width:100%;
  border:1px solid var(--ui-border);
  border-radius:12px;
  padding:14px;
  font-size:16px;
  margin-bottom:14px;
  box-sizing:border-box;
}

.photo-card{
  background:#fff;
  border-radius:16px;
  margin-bottom:25px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  overflow:hidden;
  border:2px solid transparent;
}
.photo-card.incomplete{border-color:var(--ui-orange)}
.photo-header{
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#f1f5f9;
  font-weight:bold;
}
.photo-header small{color:var(--ui-orange);font-weight:800}
.photo-body{padding:16px}

.comparison-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.comp-label{text-align:center;font-size:14px;color:var(--ui-text-gray);font-weight:bold;margin-bottom:10px}

.upload-box{
  border:2px dashed #cbd5e1;
  border-radius:12px;
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f8fafc;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}
.upload-box img{width:100%;height:100%;object-fit:cover}
.upload-icon{font-size:36px;color:#94a3b8}

.cam-btn{
  width:100%;
  margin-top:10px;
  padding:14px 0;
  border:none;
  border-radius:10px;
  background:var(--ui-blue);
  color:#fff;
  font-weight:bold;
  font-size:16px;
}
.hidden{display:none}

.remove-btn{
  position:absolute;
  top:6px;
  right:6px;
  width:28px;
  height:28px;
  border:none;
  border-radius:50%;
  background:rgba(100,116,139,.85);
  color:#fff;
  font-weight:bold;
}

.btn-add{
  background:#fff;
  border:2px dashed var(--ui-blue);
  color:var(--ui-blue);
  width:100%;
  padding:16px;
  border-radius:14px;
  font-weight:bold;
  margin-bottom:12px;
}
.complete-count{text-align:center;font-weight:bold;color:var(--ui-dark-blue);margin-bottom:12px}

.btn-submit{
  background:var(--ui-green);
  color:#fff;
  border:none;
  border-radius:14px;
  width:100%;
  padding:20px;
  font-size:21px;
  font-weight:bold;
  box-shadow:0 4px 16px rgba(34,197,94,.4);
}
.lock{pointer-events:none;opacity:.6}

/* ===== 上傳進度遮罩 ===== */
.upload-mask{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.upload-mask.hidden{display:none}

.upload-box-ui{
  background:#fff;
  width:280px;
  border-radius:16px;
  padding:22px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
.upload-title{font-weight:800;font-size:18px;margin-bottom:14px;color:#1e3a8a}
.progress-bar{width:100%;height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#3b82f6,#22c55e);
  transition:width .35s ease;
}
.progress-text{margin-top:10px;font-size:14px;font-weight:bold;color:#475569}
</style>
</head>

<body>
<div class="nav-bar"><div class="nav-title">路燈維修回報系統</div></div>

<div class="container" id="page">
  <div class="card">
    <label class="label">維修項目</label>
    <select id="sel" class="input-field"><option>載入中...</option></select>
    <label class="label">維修日期</label>
    <input type="date" id="rDate" class="input-field">
  </div>

  <div id="photoContainer"></div>

  <button class="btn-add" onclick="addGroup()">＋ 新增一組維修照片</button>
  <div class="complete-count" id="countText">尚未完成任何組別</div>

  <div class="card">
    <label class="label">維修說明 (備註)</label>
    <select id="noteSelect" class="input-field" onchange="noteChanged()">
      <option value="">無</option>
      <option value="外線故障，已通知台電處理">外線故障，已通知台電處理</option>
      <option value="自備線故障">自備線故障</option>
      <option value="其他">其他</option>
    </select>
    <textarea id="note" class="input-field hidden" style="height:80px" placeholder="請輸入說明"></textarea>
  </div>

  <button id="submitBtn" class="btn-submit" onclick="handleUpload()">確認上傳存檔</button>
</div>

<div id="uploadMask" class="upload-mask hidden">
  <div class="upload-box-ui">
    <div class="upload-title">📤 照片上傳中</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">準備中…</div>
  </div>
</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxdpaA2X-qwW4RNbMnIdHKCE3D92rlx6aztJnFIZ9CIlBWpK5ga8f2XedMLIpjLToIr/exec";
let projectData=[],idx=0;

window.onload=()=>{
  rDate.value=new Date().toISOString().split("T")[0];
  addGroup();
  fetch(SCRIPT_URL).then(r=>r.json()).then(d=>{
    projectData=d;
    sel.innerHTML='<option value="">-- 請選擇維修項目 --</option>';
    d.forEach(x=>{
      let o=document.createElement("option");
      o.value=x.row;o.textContent=x.text;
      sel.appendChild(o);
    });
  });
  noteChanged();
};

function addGroup(){
  idx++;
  photoContainer.insertAdjacentHTML("beforeend",`
<div class="photo-card incomplete" id="g${idx}">
<div class="photo-header">
<span>📸 第 ${idx} 組維修照片 <small>(未完成)</small></span>
<span onclick="removeGroup(${idx})" style="cursor:pointer">刪除</span>
</div>
<div class="photo-body">
<div class="comparison-grid">
${imgBlock(idx,"pre","維修前照片")}
${imgBlock(idx,"post","維修後照片")}
</div></div></div>`);
  renumberGroups();
}

function removeGroup(i){
  if(document.querySelectorAll(".photo-card").length<=1) return alert("至少要保留一組");
  if(confirm("確定刪除？")){
    document.getElementById("g"+i)?.remove();
    count();renumberGroups();
  }
}

function renumberGroups(){
  document.querySelectorAll(".photo-card").forEach((c,i)=>{
    c.querySelector(".photo-header span").innerHTML=
      `📸 第 ${i+1} 組維修照片 <small>${c.classList.contains("incomplete")?"(未完成)":"(完成)"}</small>`;
  });
}

function imgBlock(i,t,l){
return `
<div>
<div class="comp-label">${l}</div>
<div class="upload-box" onclick="pick(${i},'${t}')">
<div class="upload-icon" id="${t}i${i}">照片上傳📷</div>
<div id="${t}w${i}"></div>
</div>
<button class="cam-btn" id="btn-${t}-${i}" onclick="cam(${i},'${t}')">📸 拍照上傳</button>
<input type="file" class="hidden" id="f-${t}-${i}" accept="image/*" onchange="preview(this,${i},'${t}')">
</div>`;
}

function pick(i,t){if(!document.querySelector(`#${t}w${i} img`))document.getElementById(`f-${t}-${i}`).click()}
function cam(i,t){let x=document.getElementById(`f-${t}-${i}`);x.setAttribute("capture","camera");x.click()}

function preview(inp,i,t){
  let r=new FileReader();
  r.onload=e=>{
    document.getElementById(`${t}w${i}`).innerHTML=
      `<button class="remove-btn" onclick="clr(event,${i},'${t}')">✕</button><img src="${e.target.result}">`;
    document.getElementById(`${t}i${i}`).classList.add("hidden");
    document.getElementById(`btn-${t}-${i}`).classList.add("hidden");
    update(i);
  };
  r.readAsDataURL(inp.files[0]);
}

function clr(e,i,t){
  e.stopPropagation();
  document.getElementById(`${t}w${i}`).innerHTML="";
  document.getElementById(`${t}i${i}`).classList.remove("hidden");
  document.getElementById(`btn-${t}-${i}`).classList.remove("hidden");
  document.getElementById(`f-${t}-${i}`).value="";
  update(i);
}

function update(i){
  let g=document.getElementById("g"+i);
  let ok=g.querySelector(`#prew${i} img`)&&g.querySelector(`#postw${i} img`);
  g.classList.toggle("incomplete",!ok);
  renumberGroups();count();
}

function count(){
  let c=[...document.querySelectorAll(".photo-card")].filter(x=>!x.classList.contains("incomplete")).length;
  countText.textContent=c?`✅ 已完成 ${c} 組維修照片`:"尚未完成任何組別";
}

function noteChanged(){
  if(noteSelect.value === "其他"){
    note.classList.remove("hidden");
    note.value = "";          // ← 關鍵：切到「其他」一定清空
    note.focus();
  }else{
    note.classList.add("hidden");
    note.value = noteSelect.value;
  }
}

/* ===== 上傳進度 ===== */
function showProgress(){uploadMask.classList.remove("hidden");updateProgress(0,"初始化中…")}
function updateProgress(p,t){progressFill.style.width=p+"%";progressText.textContent=t}

async function handleUpload(){
  if(!sel.value) return alert("請選擇維修項目");
  if([...document.querySelectorAll(".photo-card")].some(g=>{
    let i=g.id.slice(1);
    return !(g.querySelector(`#prew${i} img`)&&g.querySelector(`#postw${i} img`));
  })) return alert("有照片未完成");

  page.classList.add("lock");
  showProgress();

  let photos=[],groups=[...document.querySelectorAll(".photo-card")];
  let total=groups.length*2,done=0;

  for(let g of groups){
    let i=g.id.slice(1);
    let pre=g.querySelector(`#prew${i} img`);
    let post=g.querySelector(`#postw${i} img`);
    let a=null,b=null;
    if(pre){a=await compress(pre.src);done++;updateProgress(done/total*80,`壓縮中 ${done}/${total}`)}
    if(post){b=await compress(post.src);done++;updateProgress(done/total*80,`壓縮中 ${done}/${total}`)}
    photos.push({pre:a,post:b});
  }

  updateProgress(85,"送出資料中…");
  let cur=projectData.find(d=>d.row==sel.value);

  await fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      row:sel.value,
      note:note.value,
      dateStr:rDate.value,
      photos,
      nameA:cur.colA,
      nameB:cur.colB
    })
  });

  updateProgress(100,"完成");
  setTimeout(()=>{alert("上傳成功");location.reload()},600);
}

function compress(b){
  return new Promise(res=>{
    let i=new Image();i.src=b;i.onload=()=>{
      let c=document.createElement("canvas"),w=i.width,h=i.height,m=1024;
      if(w>h&&w>m){h*=m/w;w=m}else if(h>m){w*=m/h;h=m}
      c.width=w;c.height=h;
      c.getContext("2d").drawImage(i,0,0,w,h);
      res(c.toDataURL("image/jpeg",.7));
    };
  });
}
</script>
</body>
</html>
