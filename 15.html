<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>路燈維修系統 (多組照片版)</title>

<style>
body{
    font-family:sans-serif;
    background:#f4f7f6;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
    padding:20px;
}
.card{
    background:#fff;
    padding:25px;
    width:100%;
    max-width:450px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}
h3{
    text-align:center;
    color:#2c3e50;
    margin-top:0;
}
label{
    font-size:14px;
    font-weight:bold;
    color:#34495e;
    display:block;
    margin-top:15px;
}
select,input,textarea,button{
    width:100%;
    padding:12px;
    margin-top:8px;
    border-radius:6px;
    border:1px solid #ddd;
    box-sizing:border-box;
    font-size:16px;
}
.photo-group{
    background:#f9f9f9;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    border:1px dashed #ccc;
}
textarea{
    resize:vertical;
    min-height:80px;
    display:none;
}
.btn-add{
    background:#3498db;
    color:#fff;
    border:none;
    cursor:pointer;
    margin-top:10px;
    font-size:14px;
}
.btn-camera{
    background:#8e44ad;
    color:#fff;
    border:none;
    cursor:pointer;
    margin-top:6px;
    font-size:14px;
}
.btn-submit{
    background:#27ae60;
    color:#fff;
    border:none;
    cursor:pointer;
    font-weight:bold;
    margin-top:25px;
    font-size:18px;
}
button:disabled{ background:#bdc3c7; }
#status{
    font-size:13px;
    margin-top:15px;
    background:#eaf2f8;
    padding:12px;
    border-radius:6px;
    display:none;
    border-left:5px solid #27ae60;
}
.preview{
    display:flex;
    gap:8px;
    margin-top:6px;
    flex-wrap:wrap;
}
.preview img{
    width:88px;
    height:88px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid #ddd;
    box-shadow:0 2px 6px rgba(0,0,0,0.12);
}
.hidden-camera{
    display:none;
}
</style>
</head>

<body>
<div class="card">
<h3>🛠 路燈維修回報 (多組照片)</h3>

<label>選擇維修項目</label>
<select id="sel"><option>載入中...</option></select>

<label>完成日期 (I 欄)</label>
<input type="date" id="rDate">

<div id="photoContainer">
    <div class="photo-group">
        <label>📷 第 1 組 - 維修前</label>
        <input type="file" class="f-pre" accept="image/*">
        <button type="button" class="btn-camera" onclick="openCamera(this)">📸 拍照上傳</button>
        <input type="file" class="f-pre-cam hidden-camera" accept="image/*" capture="environment">
        <div class="preview pre-preview"></div>

        <label>📷 第 1 組 - 維修後</label>
        <input type="file" class="f-post" accept="image/*">
        <button type="button" class="btn-camera" onclick="openCamera(this)">📸 拍照上傳</button>
        <input type="file" class="f-post-cam hidden-camera" accept="image/*" capture="environment">
        <div class="preview post-preview"></div>
    </div>
</div>

<button type="button" class="btn-add" onclick="addPhotoGroup()">＋ 增加一組照片</button>

<hr>

<label>維修說明 (L 欄)</label>
<select id="noteType" onchange="checkNoteType()">
    <option value="無">無</option>
    <option value="台電線路問題">台電線路問題</option>
    <option value="其他">其他</option>
</select>
<textarea id="noteOther"></textarea>

<button id="btn" class="btn-submit" onclick="handleUpload()">確認上傳存檔</button>
<div id="status"></div>
</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxdpaA2X-qwW4RNbMnIdHKCE3D92rlx6aztJnFIZ9CIlBWpK5ga8f2XedMLIpjLToIr/exec";
let projectData=[], groupCount=1;

/* ===== 相機按鈕 ===== */
function openCamera(btn){
    btn.nextElementSibling.click();
}

function bindPreview(input, preview){
    input.addEventListener("change",()=>{
        preview.innerHTML="";
        if(!input.files[0])return;
        const r=new FileReader();
        r.onload=e=>{
            const img=document.createElement("img");
            img.src=e.target.result;
            preview.appendChild(img);
        };
        r.readAsDataURL(input.files[0]);
    });
}

window.onload=function(){
    document.getElementById("rDate").value=new Date().toISOString().split("T")[0];

    fetch(SCRIPT_URL).then(r=>r.json()).then(d=>{
        projectData=d;
        const sel=document.getElementById("sel");
        sel.innerHTML='<option value="">-- 請選擇 --</option>';
        d.forEach(x=>{
            let o=document.createElement("option");
            o.value=x.row;
            o.textContent=x.text;
            sel.appendChild(o);
        });
    });

    const g=document.querySelector(".photo-group");
    bindPreview(g.querySelector(".f-pre"),g.querySelector(".pre-preview"));
    bindPreview(g.querySelector(".f-pre-cam"),g.querySelector(".pre-preview"));
    bindPreview(g.querySelector(".f-post"),g.querySelector(".post-preview"));
    bindPreview(g.querySelector(".f-post-cam"),g.querySelector(".post-preview"));
};

function addPhotoGroup(){
    groupCount++;
    const c=document.getElementById("photoContainer");
    const d=document.createElement("div");
    d.className="photo-group";
    d.innerHTML=`
        <label>📷 第 ${groupCount} 組 - 維修前</label>
        <input type="file" class="f-pre" accept="image/*">
        <button type="button" class="btn-camera" onclick="openCamera(this)">📸 拍照上傳</button>
        <input type="file" class="f-pre-cam hidden-camera" accept="image/*" capture="environment">
        <div class="preview pre-preview"></div>

        <label>📷 第 ${groupCount} 組 - 維修後</label>
        <input type="file" class="f-post" accept="image/*">
        <button type="button" class="btn-camera" onclick="openCamera(this)">📸 拍照上傳</button>
        <input type="file" class="f-post-cam hidden-camera" accept="image/*" capture="environment">
        <div class="preview post-preview"></div>
    `;
    c.appendChild(d);

    bindPreview(d.querySelector(".f-pre"),d.querySelector(".pre-preview"));
    bindPreview(d.querySelector(".f-pre-cam"),d.querySelector(".pre-preview"));
    bindPreview(d.querySelector(".f-post"),d.querySelector(".post-preview"));
    bindPreview(d.querySelector(".f-post-cam"),d.querySelector(".post-preview"));
}

function checkNoteType(){
    document.getElementById("noteOther").style.display=
        noteType.value==="其他"?"block":"none";
}

/* === 上傳與壓縮（原邏輯保留） === */
async function handleUpload(){ /* 你的原本 handleUpload 不變 */ }
function compress(file){ /* 你的原本 compress 不變 */ }
</script>
</body>
</html>
